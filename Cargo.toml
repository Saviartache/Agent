[package]
name = "ui-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Персонаж рабочего стола Windows: свой поток, layered-окна, поведение, анимации, эффекты"
repository = "https://github.com/Saviartache/Agent"
publish = false

[lib]
name = "ui_agent"
path = "src/lib.rs"

[dependencies]
# Декодер спрайтов (и кодер у генератора набора по умолчанию).
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
